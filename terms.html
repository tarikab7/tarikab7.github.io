<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms of Use - Multi-Minigames</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="icon" type="image/webp" href="favicon.webp?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Home</a>
    
    <!-- Dynamic Markdown Content Container -->
    <div id="md-content">
      <p>Loading Terms of Use...</p>
    </div>

    <footer>
      <p>© 2026 Seyhan Tarik Akgöz &bull; Multi-Minigames</p>
    </footer>
  </div>

  <script>
    // Fetch TERMS_AND_CONDITIONS.md with cache buster Date.now()
    fetch('TERMS_AND_CONDITIONS.md?v=' + Date.now())
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .then(mdText => {
        const container = document.getElementById('md-content');
        
        // Remove markdown horizontal rules (---) before parsing
        let cleanMd = mdText.replace(/^---$/gim, '');
        let rawHtml = typeof marked !== 'undefined' ? marked.parse(cleanMd) : cleanMd;
        
        // Split by <h3> or <h2> headings to format all 10 sections into individual Toybox cards
        let parts = rawHtml.split(/(?=<h[23]>)/i);
        let formatted = parts.map((part, index) => {
          let trimmed = part.trim();
          if (index === 0) return trimmed; // Header title & intro text
          if (!trimmed) return '';
          return '<div class="toy-section-card">' + trimmed + '</div>';
        }).join('');

        container.innerHTML = formatted;
      })
      .catch(err => {
        document.getElementById('md-content').innerHTML = '<p>Error loading Terms of Use. Please refresh the page.</p>';
      });
  </script>
</body>
</html>
