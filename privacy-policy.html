<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy - Multi-Minigames</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/webp" href="favicon.webp">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --tb-paper: #FAF1E0;
      --tb-paper-deep: #E5D5B7;
      --tb-cloud: #FFFBF2;
      --tb-black: #000000;
      --tb-ink-muted: #555048;
      --tb-lemon: #FFD335;
      --tb-blue: #4D9DE8;
      
      --tb-stroke: 4px solid #000000;
      --tb-shadow-card: 8px 8px 0px #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: var(--tb-paper);
      background-image: 
        radial-gradient(var(--tb-paper-deep) 22%, transparent 22%),
        radial-gradient(var(--tb-paper-deep) 22%, transparent 22%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--tb-black);
      line-height: 1.65;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--tb-cloud);
      border: var(--tb-stroke);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: var(--tb-shadow-card);
    }

    a.back-btn {
      font-family: 'Fredoka', cursive, sans-serif;
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: var(--tb-paper);
      color: var(--tb-black);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: 3px solid #000000;
      border-radius: 16px;
      box-shadow: 4px 4px 0px #000000;
      margin-bottom: 1.75rem;
      transition: all 0.1s ease;
    }

    a.back-btn:hover {
      background: var(--tb-lemon);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    /* Markdown Rendered Content Styles */
    #md-content h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    #md-content .toy-section-card {
      background: var(--tb-paper);
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 4px 4px 0px #000000;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    #md-content h2, #md-content h3, #md-content h4 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 700;
      color: #000000;
      margin-bottom: 0.6rem;
    }

    #md-content h2 { font-size: 1.5rem; }
    #md-content h3 { font-size: 1.35rem; }
    #md-content h4 { font-size: 1.15rem; margin-top: 1rem; }

    #md-content p {
      font-size: 1rem;
      margin-bottom: 0.85rem;
    }

    #md-content ul, #md-content ol {
      padding-left: 1.4rem;
      margin-bottom: 0.85rem;
    }

    #md-content li {
      margin-bottom: 0.4rem;
    }

    #md-content a {
      color: var(--tb-blue);
      font-weight: 700;
    }

    footer {
      font-size: 0.95rem;
      color: var(--tb-ink-muted);
      margin-top: 2.5rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Home</a>
    
    <!-- Dynamic Markdown Content Container -->
    <div id="md-content">
      <p>Loading Privacy Policy...</p>
    </div>

    <footer>
      <p>© 2026 Seyhan Tarik Akgöz &bull; Multi-Minigames</p>
    </footer>
  </div>

  <script>
    // Fetch PRIVACY_POLICY.md with cache buster Date.now()
    fetch('PRIVACY_POLICY.md?v=' + Date.now())
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .then(mdText => {
        const container = document.getElementById('md-content');
        
        // Remove markdown horizontal rules (---) before parsing
        let cleanMd = mdText.replace(/^---$/gim, '');
        let rawHtml = typeof marked !== 'undefined' ? marked.parse(cleanMd) : cleanMd;
        
        // Split by <h3> or <h2> headings to format all 8 sections into individual Toybox cards
        let parts = rawHtml.split(/(?=<h[23]>)/i);
        let formatted = parts.map((part, index) => {
          let trimmed = part.trim();
          if (index === 0) return trimmed; // Header title & intro text
          if (!trimmed) return '';
          return '<div class="toy-section-card">' + trimmed + '</div>';
        }).join('');

        container.innerHTML = formatted;
      })
      .catch(err => {
        document.getElementById('md-content').innerHTML = '<p>Error loading Privacy Policy. Please refresh the page.</p>';
      });
  </script>
</body>
</html>
