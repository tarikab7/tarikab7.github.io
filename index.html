<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Minigames: 1v1 Offline Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --tb-paper: #FAF1E0;
      --tb-paper-deep: #E5D5B7;
      --tb-cloud: #FFFBF2;
      --tb-black: #000000;
      --tb-ink-muted: #555048;
      
      --tb-sun: #FFA51F;
      --tb-grass: #78BE4C;
      --tb-blue: #4D9DE8;
      --tb-lemon: #FFD335;
      
      /* Thicker Black Outlines & Hard Shadows */
      --tb-stroke: 4px solid #000000;
      --tb-shadow-card: 8px 8px 0px #000000;
      --tb-shadow-btn: 5px 5px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: var(--tb-paper);
      background-image: 
        radial-gradient(var(--tb-paper-deep) 22%, transparent 22%),
        radial-gradient(var(--tb-paper-deep) 22%, transparent 22%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--tb-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .main-card {
      max-width: 520px;
      width: 100%;
      background: var(--tb-cloud);
      border: var(--tb-stroke);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: var(--tb-shadow-card);
      text-align: center;
    }

    h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 0.3rem;
      color: var(--tb-black);
      letter-spacing: 0.5px;
    }

    p.developer {
      font-size: 1.1rem;
      color: var(--tb-ink-muted);
      font-weight: 600;
      margin-bottom: 2.25rem;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }

    a.link-btn {
      font-family: 'Fredoka', cursive, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.05rem 1.4rem;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 20px;
      border: var(--tb-stroke);
      box-shadow: var(--tb-shadow-btn);
      transition: all 0.1s ease;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    a.btn-play {
      background: var(--tb-grass);
      color: #ffffff;
    }

    a.btn-privacy {
      background: var(--tb-sun);
      color: #000000;
    }

    a.btn-terms {
      background: var(--tb-lemon);
      color: #000000;
    }

    a.btn-ads {
      background: var(--tb-blue);
      color: #ffffff;
    }

    a.link-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0px #000000;
    }

    a.link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    footer {
      font-size: 0.95rem;
      color: var(--tb-ink-muted);
      margin-top: 1rem;
      font-weight: 600;
    }

    footer a {
      color: var(--tb-black);
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <h1>Multi-Minigames</h1>
    <p class="developer">1v1 Offline Battles by Seyhan Tarik Akgöz</p>

    <div class="links-grid">
      <a href="https://play.google.com/store/apps/details?id=com.tarik.multiminigames" target="_blank" rel="noopener" class="link-btn btn-play">
        Google Play Store
      </a>
      <a href="privacy-policy.html" class="link-btn btn-privacy">
        Privacy Policy
      </a>
      <a href="terms.html" class="link-btn btn-terms">
        Terms of Use
      </a>
      <a href="app-ads.txt" class="link-btn btn-ads">
        app-ads.txt
      </a>
    </div>

    <footer>
      <p>© 2026 Seyhan Tarik Akgöz &bull; Contact: <a href="mailto:studio@tarikakgoz.com">studio@tarikakgoz.com</a></p>
    </footer>
  </div>

</body>
</html>
