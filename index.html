<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Minigames: 1v1 Offline Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --tb-paper: #FAF1E0;
      --tb-cloud: #FFFBF2;
      --tb-ink: #3D3A34;
      --tb-ink-muted: #6A6458;
      --tb-sun: #FFA51F;
      --tb-grass: #78BE4C;
      --tb-blue: #4D9DE8;
      --tb-lemon: #FFD335;
      --tb-stroke: 3px solid #3D3A34;
      --tb-shadow: 5px 5px 0px #3D3A34;
      --tb-shadow-btn: 3px 3px 0px #3D3A34;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Inter', sans-serif;
      background-color: var(--tb-paper);
      color: var(--tb-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .main-card {
      max-width: 540px;
      width: 100%;
      background: var(--tb-cloud);
      border: var(--tb-stroke);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: var(--tb-shadow);
      text-align: center;
    }

    .app-icon {
      font-size: 3.5rem;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    p.developer {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--tb-ink-muted);
      font-weight: 500;
      margin-bottom: 2rem;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 2rem;
    }

    a.link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 1.2rem;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      border: var(--tb-stroke);
      box-shadow: var(--tb-shadow-btn);
      transition: all 0.1s ease;
      cursor: pointer;
    }

    a.btn-play {
      background: var(--tb-grass);
      color: #ffffff;
    }

    a.btn-privacy {
      background: var(--tb-sun);
      color: var(--tb-ink);
    }

    a.btn-terms {
      background: var(--tb-lemon);
      color: var(--tb-ink);
    }

    a.btn-ads {
      background: var(--tb-blue);
      color: #ffffff;
    }

    a.link-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--tb-ink);
    }

    a.link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--tb-ink);
    }

    footer {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--tb-ink-muted);
      margin-top: 1rem;
    }

    footer a {
      color: var(--tb-ink);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="app-icon">🎮</div>
    <h1>Multi-Minigames</h1>
    <p class="developer">1v1 Offline Battles &bull; By Seyhan Tarik Akgöz</p>

    <div class="links-grid">
      <a href="https://play.google.com/store/apps/details?id=com.tarik.multiminigames" target="_blank" rel="noopener" class="link-btn btn-play">
        <span>▶</span> Google Play Store
      </a>
      <a href="privacy-policy.html" class="link-btn btn-privacy">
        <span>🔒</span> Privacy Policy
      </a>
      <a href="terms.html" class="link-btn btn-terms">
        <span>📜</span> Terms of Use
      </a>
      <a href="app-ads.txt" class="link-btn btn-ads">
        <span>📄</span> app-ads.txt
      </a>
    </div>

    <footer>
      <p>© 2026 Seyhan Tarik Akgöz &bull; Contact: <a href="mailto:studio@tarikakgoz.com">studio@tarikakgoz.com</a></p>
    </footer>
  </div>

</body>
</html>
